version: '3.8'

services:
  # MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: fulfillment-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fulfillment_db
      MYSQL_USER: fulfillment_user
      MYSQL_PASSWORD: fulfillment_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fulfillment-backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://fulfillment_user:fulfillment_pass@mysql:3306/fulfillment_db
      - SEED=20261022
      - APP_ENV=production
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # Frontend Vite/React Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fulfillment-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
